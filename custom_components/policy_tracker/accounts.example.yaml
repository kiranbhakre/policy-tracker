# Example accounts file for the native Home Assistant integration.
#
# Same overall format as the project's config.example.yaml, but login
# steps use value_credential instead of value_env: the config flow's
# "credentials" step asks for these directly in the Home Assistant UI
# (stored in Home Assistant's own config entry storage) instead of
# reading them from the environment. value_env and a literal value
# still work too, if you'd rather manage a particular account's
# credentials as env vars even with this integration.
#
# Every selector below is a PLACEHOLDER - find the real ones with the
# standalone script's `python3 tracker.py --discover <id>` and
# `--interactive <id>` first, then copy the finished login_steps and
# fields here, swapping value_env for value_credential.

profile_dir: "./policy_tracker_profiles"

accounts:
  - id: lg_pension
    name: "L&G Workplace Pension"
    provider: "Legal & General"
    type: pension

    login_url: "https://www.landg.com/REPLACE_WITH_REAL_LOGIN_PATH"

    login_steps:
      - action: fill
        selector: "#REPLACE_WITH_USERNAME_FIELD_SELECTOR"
        value_credential: username
      - action: fill
        selector: "#REPLACE_WITH_PASSWORD_FIELD_SELECTOR"
        value_credential: password
      - action: click
        selector: "#REPLACE_WITH_SIGN_IN_BUTTON_SELECTOR"
      - action: wait
        selector: "#REPLACE_WITH_SOMETHING_THAT_APPEARS_AFTER_LOGIN"
        timeout_ms: 15000

    otp_selector: "#REPLACE_WITH_OTP_INPUT_SELECTOR"
    logged_in_selector: "#REPLACE_WITH_LOGGED_IN_MARKER_SELECTOR"

    fields:
      - id: fund_value
        label: "Total fund value"
      - id: transfer_value
        label: "Transfer value"
